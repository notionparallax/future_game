title: Quantum computers
live: true
card_type: technology
image:
    source: image40.jpg
body:
    paragraphs:
        - Quantum computers are able to solve a particular type of problem incredibly fast.
            Unfortunately, that particular type of problem is the one that the world's encryption
            systems are based on.
        - Quantum computers are still mostly a research tool, but if they become a real world
            technology then the encryption that protects internet transactions will be breakable.
            Governments and banks are already moving to post-quantum cryptography; NIST published
            its first standards for it in August 2024[^pqc].
        - From a more optimistic angle, once computer scientists work out how to phrase their
            problems in the way that quantum computers like, lots of very hard problems become
            quite easy!
consider:
    - How much disruption would it cause if electronic money, and other encryption methods,
        stopped working?
    - Protein structure prediction has already been largely solved by AI (AlphaFold, Nobel Prize
        in Chemistry 2024). What would it mean for the pharma industry if quantum computers
        did the same for other hard problems?
footnotes:
    pqc: '[NIST Releases First 3 Finalized Post-Quantum Encryption Standards](https://www.nist.gov/news-events/news/2024/08/nist-releases-first-3-finalized-post-quantum-encryption-standards)'
