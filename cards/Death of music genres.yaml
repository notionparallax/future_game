title: Death of music genres
live: true
card_type: social
image:
    source: commons-vinyl-collection-at-a-record-store-unsplash.jpg
    caption: Second-hand vinyl records sorted in bins at a record shop in Lyon
    citation: Mr Cup / Fabien Barral iammrcup, CC0, via Wikimedia Commons
    link: https://commons.wikimedia.org/wiki/File:Vinyl_collection_at_a_record_store_(Unsplash).jpg
body:
    paragraphs:
        - Spotify’s move toward mood-driven instead of genre-driven playlists has been successful
            to the point of suggesting that musical genres themselves will be increasingly outmoded[^outmodedGenres]
            in the coming years – or at least completely illegible.
consider:
    - If you can't name your genre, what do you use to find your tribe?
    - Genres were partly a way to sort records in shops. What takes their place when there are
        no shops?
    - Who decides what a 'mood' is, and what happens to artists who don't fit one?
footnotes:
    outmodedGenres: https://victrola.com/blogs/articles/music-industry-trends-to-look-for-in-2021
