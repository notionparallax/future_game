title: Urbanisation
live: true
card_type: trend
image:
    caption: Populations and urbanisation percentages
    citation: by Hannah Ritchie and Max Roser, Our World in Data
    link: https://ourworldindata.org/urbanization
    source: image6.jpg
body:
    paragraphs:
        - Roughly 58% of the world's population lived in cities in 2025, and the UN has projected
            that to reach about 68% by 2050[^urb]. In Australia it's already around 86%.
        - Planning forecasts for Sydney in the 2000s (from the NSW Department of Infrastructure
            Planning and Natural Resources, since replaced) assumed a net increase of 40,500
            people a year and a demand for 25,000 new dwellings a year, with 25% of that growth
            located in Greenfield sites on the urban periphery and Greater Metropolitan Region
            corridors.
        - With the enlarging population and increasing urbanisation the demands on resources
            will contribute to further degradation of the Australian environment and Sydney's
            ever expanding urban sprawl.
consider:
    - Is it inevitable that the urbanisation trend will continue?
    - Can we bring traditionally rural activities into cities too?
    - What benefits could come from even greater urban density?
    - What mistakes are cities making right now that we might not make in the future?
footnotes:
    urb: '[UN: 68% of the world population projected to live in urban areas by 2050](https://www.un.org/development/desa/en/news/population/2018-revision-of-world-urbanization-prospects.html)'
