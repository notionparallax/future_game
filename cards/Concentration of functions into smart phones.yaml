title: Concentration of functions into smart phones
live: true
card_type: trend
image:
    source: commons-iphone-models.jpg
    caption: A lineup of iPhone models
    citation: Ka Kit Pang, CC BY-SA 4.0, via Wikimedia Commons
    link: https://commons.wikimedia.org/wiki/File:IPhone_models.jpg
body:
    paragraphs:
        - Since smart phones emerged by merging personal digital assistants (PDAs) and telephones,
            they've been capturing more functions. Now films and documentaries regularly contain
            smartphone footage. You can pay with your phone, and keep your driving licence,
            so they've usurped wallets. Most online shopping is done on a phone. They are all
            round music players and controllers for our smart homes.
consider:
    - What else could end up on a phone?
    - Is this concentration causing a single point of failure? If your phone goes flat away
        from home are you totally powerless? (No pun intended)
    - Does it even make sense to call it a phone any more?
    - What other form factors could it take? What's stopping this?
