title: Internet coverage
live: true
card_type: social
image:
    caption: '[^ic30]'
    citation: Data from
    link: https://goo.gl/L3TER1
    source: image38.png
body:
    paragraphs:
        - In the last quarter of a century the internet has changed the way the world operates.
            Access to the internet isn't ubiquitous. A large part of the world can't access
            what we take for granted. Projects like Facebook's internet.org[^ic31] and Google's
            Project Loon[^ic32] were trying to change that but their parent companies deemed
            them unprofitable.
        - 'In 2025 the ITU estimated that 6 billion people (about three-quarters of the world)
            use the internet and 2.2 billion don''t, 96% of them in low- and middle-income countries[^itu].
            Satellite internet is changing the picture: Starlink reported more than 10 million
            customers in early 2026[^starlink].'
        - Those unconnected people stand to gain from internet access and are also a giant market.
            The countries at the bottom of this graph have little in the way of fixed infrastructure,
            so may leapfrog the countries at the top of the graph if satellite internet becomes
            the norm.
consider:
    - What could a society do if the penetration was 100%? Online democracy? Compete in a global
        job market?
    - What is preventing the last few % from being connected? Is it choice or something else?
footnotes:
    ic30: https://bit.ly/3Hxlzl3
    ic31: '[internet.org](https://internet.org/) was planning to make internet access available
        through solar powered planes.'
    ic32: '[Loon](http://www.google.com/loon/) was planning to make internet access available
        through weather balloons.'
    itu: '[ITU Facts and Figures 2025](https://www.itu.int/en/mediacentre/Pages/PR-2025-11-17-Facts-and-Figures.aspx)'
    starlink: '[Wikipedia: Starlink](https://en.wikipedia.org/wiki/Starlink)'
