title: China power shift
live: true
card_type: social
image:
    source: commons-shanghai-skyline-waterfront-pudong-5166168-69-70.jpg
    caption: The Pudong skyline and waterfront in Shanghai, with the Shanghai Tower
    citation: Ermell, CC0, via Wikimedia Commons
    link: https://commons.wikimedia.org/wiki/File:Shanghai_skyline_waterfront_pudong_5166168_69_70.jpg
body:
    paragraphs:
        - China’s status as an economic, political and cultural center will continue its meteoric
            rise. The US will continue its downward spiral. Chinese consumption patterns will
            set the tone[^chinaPDF] for the world.
consider:
    - Is it inevitable that China will take the USA's place as the leading global power?
    - Is there only room for one, or can China, the USA and Russia exist peacefully as equals?
    - China's culture is quite different to the USA's, what will that culture look like when
        it's overlaid onto the 'Americanised west'?
