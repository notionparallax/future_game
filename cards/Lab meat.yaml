title: Lab meat
live: true
card_type: technology
image:
    source: labmeat.jfif
body:
    paragraphs:
        - Ruminants, like cows and sheep, emit a lot of greenhouse gasses. They are also sentient
            beings. Those are two pretty compelling reasons not to eat them. However, meat is
            a dense source of calories, protein and vitamins. If we can culture meat in a lab,
            then we can have all the upsides without any of the downsides.
        - 'The first approvals have arrived: Singapore in 2020, the USA in 2023, and Australia
            and New Zealand in 2025, where cultured quail from the Sydney start-up Vow became
            the first cultivated meat approved for sale there[^cultivated]. Price and scale
            are now the hard problems.'
consider:
    - Will we start to design meats that aren't copies of animals?
    - Will lab meat ever overcome the yuk factor?
    - What will happen to the meat industry? What about the animals that are already alive?
    - What will we do with all the spare land that is freed up?
footnotes:
    cultivated: '[Cultivated meat approved for sale in Australia](https://www.foodmanufacture.co.uk/Article/2025/06/18/cultivated-meat-approved-for-sale-in-australia)'
