title: Deep-sea mining
live: true
card_type: technology
image:
    source: commons-observation-lors-de-la-campagne-eden-des-traces-du-pr-l-veme.jpg
    caption: Seafloor tracks left by a nodule collector robot during the EDEN campaign
    citation: Florian Besson (Ifremer Centre Bretagne, REM-GEOOCEAN-ANTIPOD - ZI de la Pointe
        , CC BY 4.0, via Wikimedia Commons
    link: https://commons.wikimedia.org/wiki/File:Observation_lors_de_la_campagne_EDEN_des_traces_du_pr%C3%A9l%C3%A8vement_de_nodules_polym%C3%A9taliques_par_le_robot_Patania_en_2021_(Ifremer_00956-106832_-_54946).jpg
body:
    paragraphs:
        - 'Fist-sized nodules lying on the sea floor in the Clarion-Clipperton Zone of the Pacific
            are rich in nickel, cobalt, copper and manganese: metals that go into batteries[^ccz].
            Mining them would avoid some of the harm of land mines, and could cut the world''s
            dependence on a few countries.'
        - But the deep sea is one of the least known habitats on Earth, and scientists fear
            that mining would destroy life that can't recover on any human timescale. The International
            Seabed Authority has not finished its mining code, and over 30 countries now back
            a pause. In 2026 the US moved to licence mining through its own agency[^isa].
consider:
    - Is mining nodules from the seabed better or worse than mining the same metals on land,
        where people live?
    - Better batteries and recycling might make the metals unnecessary. Should we wait to find
        out?
    - Who owns the seabed? Should the proceeds be shared with countries with no coast?
    - How much do we need to know about a place before it is acceptable to mine it?
footnotes:
    ccz: '[Global Mining Review: Why 2026 will decide who governs the seabed](https://www.globalminingreview.com/special-reports/22042026/why-2026-will-decide-who-governs-the-seabed/)'
    isa: '[Mongabay: Deep-sea mining rules face delays despite urgent push](https://news.mongabay.com/short-article/2026/03/deep-sea-mining-rules-face-delays-despite-urgent-push/)'
