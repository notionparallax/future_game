title: Drone warfare
live: true
card_type: technology
image:
    source: commons-fpv-drones-support-of-the-dnepr-grouping-of-forces-1.png
    caption: An FPV drone fitted with an explosive charge, ready for launch
    citation: Unknown authorUnknown author, CC BY 4.0, via Wikimedia Commons
    link: https://commons.wikimedia.org/wiki/File:FPV_drones_support_of_the_Dnepr_Grouping_of_Forces_(1).png
body:
    paragraphs:
        - In Ukraine, cheap drones have changed how wars are fought. Small first-person-view
            (FPV) drones cost a few hundred dollars and are flown to their targets by a pilot
            wearing goggles. Ukrainian officials say that drones now cause most hits on Russian
            forces, between 70% and 80% or more, although the figures can't be checked[^ua].
        - 'Production has exploded: Ukraine made around 4 million drones in 2025 and plans to
            make 7 million in 2026[^prod]. In June 2025 it hid drones in trucks to hit Russian
            bombers at air bases thousands of kilometres from the front (Operation Spiderweb)[^web].'
        - Jamming is pushing drones towards autonomy, where software chooses the target. A drone
            that costs a few hundred dollars can destroy a tank or a missile launcher worth
            thousands of times more. The same tools are available to militias, criminals and
            anyone else.
consider:
    - Just as dogs become well loved members of military teams, robots do too. As robots become
        more capable, will humans value their 'lives' more?
    - Can we imagine an end game where robot armies fight on an island, to settle disputes?
    - If software chooses the target, who is responsible for what happens?
    - How would you defend a city against ten thousand cheap drones?
facilitator:
    prompts:
        - Ask a team to design the cheapest possible defence against a swarm of drones, then
            ask what the attacker would do next.
        - 'Who benefits when a war becomes cheap: the strong, the weak, or the people who sell
            drones?'
        - What would a peace agreement look like if both sides had millions of drones?
    pairs_with:
        - Drones
        - Walking robots
        - China power shift
        - AI Bias
    watch_for: This is a current war, and some players may have personal connections to it.
        Keep the discussion on how the technology changes conflict, and check in with anyone
        who seems affected.
