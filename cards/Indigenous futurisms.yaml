title: Indigenous futurisms
live: true
card_type: worldview
body:
    paragraphs:
        - 'Indigenous peoples have imagined and built futures for tens of thousands of years,
            and tell stories that don''t treat colonisation as the end. The term covers art,
            writing, games and film. A linked idea is relational custodianship: Country is kin,
            and the duty to care for it comes before any claim to own it.'
        - There is no single Indigenous worldview. Hundreds of nations have their own.
lens:
    celebrates: Relationships with Country and kin, human and non-human. Long time horizons.
        Responsibility before ownership.
    fears: Further dispossession. Extraction that treats land as a resource. Being written out
        of the future.
    would_do: Put Traditional Owners in charge of decisions about their land and water. Plan
        for generations, not budget cycles.
    blind_spot: Using this as a tidy lens risks flattening many nations into one stereotype.
        It describes a way of relating to place, which can be hard to apply in a city, or to
        technology.
consider:
    - Who are the Traditional Owners of the place where your story happens, and what would they
        say about it?
    - What would planning for seven generations change about your cards?
facilitator:
    prompts:
        - Whose Country is your story set on? What would the people who belong to it say about
            your world?
        - What would change if a decision had to be good for seven generations?
        - Find a card that treats land as a resource. Rewrite it as a card that treats land
            as kin.
    pairs_with:
        - Rights of nature
        - 30 by 30
        - Megafires and cultural burning
        - Deep ecology
    watch_for: There is no single Indigenous worldview, and no one at the table should speak
        for any nation. If you can, invite a Traditional Owner or an Indigenous participant
        to run this card rather than read it.
footnotes:
    src: '[Wikipedia: Indigenous futurism](https://en.wikipedia.org/wiki/Indigenous_futurism)'
meta:
    sources:
        -   source_comment: First draft by Claude (October 2026). Written to describe the worldview
                as its supporters would recognise it; needs checking before printing. Please
                have someone from this community read it first.
            update_date: '2026-10-06'
    status: draft
