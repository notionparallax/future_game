title: Religious extremism
live: true
card_type: social
image:
    source: commons-1893parliament.jpg
    caption: Delegates at the 1893 World's Parliament of Religions in Chicago
    citation: UnknownUnknown, Public domain, via Wikimedia Commons
    link: https://commons.wikimedia.org/wiki/File:1893parliament.jpg
body:
    paragraphs:
        - 'Some of the most violent movements of recent decades have justified themselves with
            religion: jihadist groups, Hindu and Buddhist nationalist violence, Christian nationalist
            militias, Jewish settler extremists. Each has its own history and grievances, and
            most believers in each tradition reject them.'
        - Religion as a whole is not fading. Between 2010 and 2020 the Muslim share of the world
            rose from 23.8% to 25.6%, the share with no religion rose to 24.2%, and the Christian
            share fell to 28.8%[^pew]. Some societies are becoming more religious and others
            less, and the friction may be where the two meet.
        - Extremism thrives where there are grievances, humiliation, weak states, and a sense
            of purpose on offer. Online networks let small movements reach recruits anywhere.
consider:
    - What makes someone willing to die or kill for a belief? What could offer them something
        better?
    - Where do you draw the line between a strong faith and an extreme one?
    - How would a society with fewer religious people treat the ones who are left? What about
        the reverse?
    - Is a secular ideology (nationalism, a political cause) any different?
facilitator:
    prompts:
        - Ask what a movement like this offers a young person that nothing else does.
        - What changes in your world if religion grows in some places and shrinks in others?
        - Which secular movements in your world have the same features?
    pairs_with:
        - Religious traditionalism
        - Post-truth and echo chambers
        - Gilead
        - Tech platform exit
    watch_for: Keep the discussion about movements and conditions, not about a faith or its
        believers. If a team starts to generalise about one religion, return to the card's other
        examples.
footnotes:
    pew: '[Pew Research Center: How the global religious landscape changed from 2010 to 2020](https://www.pewresearch.org/religion/2025/06/09/how-the-global-religious-landscape-changed-from-2010-to-2020/)'
