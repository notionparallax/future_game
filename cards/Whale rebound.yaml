title: Whale rebound
live: true
card_type: nature
image:
    source: commons-001-humpback-whale-breaching-in-ballena-marine-national-park.jpg
    caption: A humpback whale breaching in Ballena Marine National Park, Costa Rica
    citation: Giles Laurent, CC BY-SA 4.0, via Wikimedia Commons
    link: https://commons.wikimedia.org/wiki/File:001_Humpback_whale_breaching_in_Ballena_Marine_National_Park_Photo_by_Giles_Laurent.jpg
body:
    paragraphs:
        - 'Commercial whaling pushed several species to the edge of extinction. Since the ban
            in 1986 some populations have bounced back: humpbacks off eastern Australia and
            in the south-west Atlantic are now close to their pre-whaling numbers[^csiro].'
        - The recovery is uneven. Antarctic blue whales are still at only about 1% of their
            original numbers[^blue], and there are only around 380 North Atlantic right whales,
            killed mostly by ship strikes and fishing gear[^right].
        - 'Whales are a rare case where a global ban worked, slowly. They are also a test of
            how we share the sea: a recovered whale population meets a much busier ocean than
            the one it left.'
consider:
    - What changes for shipping lanes, fishing and offshore wind farms if whale numbers keep
        growing?
    - Whales took decades to recover from a ban. What does that say about how long to wait for
        other recoveries?
    - Whale watching is now worth more than whaling in many places. What other industries could
        be replaced by watching?
    - Some countries still hunt whales. Is that a matter for the whole world, or only for them?
facilitator:
    prompts:
        - Run the 'and then what?' chain from a recovered whale population to a harbour town.
            Who gains in the first five years, and who loses?
        - The recovery followed a ban that few thought would work. Ask the team to find three
            other bans or treaties that worked, and what they had in common.
        - 'Give the team a protagonist: a whale-watching operator, a container-ship captain,
            or an offshore wind engineer. Whose day gets worse?'
    pairs_with:
        - 30 by 30
        - Coral reef collapse
        - Deep-sea mining
        - Wildlife corridors
    watch_for: Teams tend to treat this as simple good news. Push them to find the losers, and
        the species that haven't recovered (North Atlantic right whales, Antarctic blue whales).
    going_further:
        - '[CSIRO: Watching whales return](https://www.csiro.au/en/news/all/articles/2017/august/watching-whales-return)'
