title: Zoom fashion
live: true
card_type: trend
image:
    source: commons-video-conference-using-laptop.jpg
    caption: A video call on a laptop screen; only the upper body of each person is visible
    citation: Project Kei, CC BY-SA 4.0, via Wikimedia Commons
    link: https://commons.wikimedia.org/wiki/File:Video_Conference_Using_Laptop.jpg
body:
    paragraphs:
        - Fashion designers and retailers will create markedly different strategies[^zoomFashion]
            for fashion that appears on the upper body, i.e. above “the Zoom line” compared
            with the bottom half of the body, which isn’ usually visible on screen.
        - Many fashion houses have been embracing comfort and loungewear. Tracksuit bottoms
            have become the de facto cool weather bottoms of the pandemic.
consider:
    - Now that we've had a taste of comfort, will we go back?
