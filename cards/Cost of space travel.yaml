title: Cost of space travel
live: true
card_type: trend
image:
    source: image55.jpg
body:
    paragraphs:
        - The average cost of traditional launch methods is about $25,000/kg[^16] but SpaceX's
            reusable Falcon 9, which lists at around $70 million a launch, gets that down to
            roughly $3,000/kg to low Earth orbit[^17]. Starship, which is designed to be fully
            reusable, is aimed at less than $500/kg[^starship], but it is still proving that
            it can do it.
        - With fully reusable launch vehicles the cost of a launch could drop to not much more
            than the cost of the propellant. Rocket propellants such as hydrogen, methane and
            oxygen can be made in bulk from water and air, potentially with solar power. Expect
            the cost to launch to continue to drop.
consider:
    - What other mechanisms might we use to get things into space?
    - What will the price drop in space travel mean for society?
    - What limits the drop in cost of space travel?
footnotes:
    '16': '[Advanced Space Transportation Program: Paving the Highway to Space](https://www.nasa.gov/centers/marshall/news/background/facts/astp.html)'
    '17': '[Wikipedia: Falcon 9](https://en.wikipedia.org/wiki/Falcon_9)'
    starship: This is a target, not a price. [How accurate were Elon Musk's Falcon 9 and Starship
        per-kg claims?](https://newspaceeconomy.ca/2026/06/21/how-accurate-were-elon-musks-falcon-9-and-starship-kg-claims/)
