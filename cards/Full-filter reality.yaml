title: Full-filter reality
live: true
card_type: technology
body:
    paragraphs:
        - Immersive, photo realistic imagery in the form of Instagram-style filter layers will
            become widespread beyond just phones when applied via increasingly mature augmented
            reality systems[^filters], forcing people to question the relationship between the
            visual and the real, and potentially fragmenting consensus reality even further.
consider:
    - If everyone sees a different version of the street, which one is 'the real one'?
    - Who owns the filter layer on public space? Could a business filter out its competitor's
        sign?
    - Would you choose to see the world unfiltered, and how would you know that you were?
footnotes:
    filters: https://www.frogdesign.com/designmind/trends-2021
