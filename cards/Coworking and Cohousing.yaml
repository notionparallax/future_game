title: Coworking and Cohousing
live: true
card_type: social
image:
    source: commons-vandkunsten-architects-jystrup-savv-rk-cohousing-community-j.jpg
    caption: Jystrup Savvaerk cohousing community, Denmark (1982-84)
    citation: seier+seier, CC BY 2.0, via Wikimedia Commons
    link: https://commons.wikimedia.org/wiki/File:Vandkunsten,_architects-_jystrup_savv%C3%A6rk_cohousing_community,_jystrup,_denmark_1982-1984_(6352477805).jpg
body:
    paragraphs:
        - A significant proportion of effort in an office or a house is directed towards non-core
            activities. I.e. maintaining the photocopier or doing laundry.
        - co-x offers a more highly serviced environment with the opportunity to mix with other,
            in theory, like-minded people.
        - Those other people are the selling point and the major downside to this model. If
            you don't get on with your co-people then hell will be other people.
consider:
    - What coordination benefits are there from sharing? What can you do better in house?
    - The inducements to co housing and working are often quite expensive, and counteract the
        efficiency gains. Is this something that you'd go for?
    - The opportunities for increasing the service level are almost endless, how far can you
        imagine pushing it?
