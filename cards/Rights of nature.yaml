title: Rights of nature
live: true
card_type: social
image:
    source: commons-wanganui-from-durie-hill.jpg
    caption: The Whanganui River and the city of Whanganui, New Zealand
    citation: Avenue, CC BY-SA 3.0, via Wikimedia Commons
    link: https://commons.wikimedia.org/wiki/File:Wanganui_from_Durie_Hill.JPG
body:
    paragraphs:
        - In law, a river, a forest or a mountain is usually property. A growing number of places
            have given them legal personhood instead, with guardians who can speak and sue on
            their behalf. Ecuador wrote the rights of nature into its constitution in 2008.
            The Whanganui River in Aotearoa New Zealand became a legal person in 2017, with
            Māori and the Crown as joint guardians. In 2022 Spain gave legal personality to
            the Mar Menor lagoon[^ron].
        - 'Supporters say that it fixes a gap: today a polluted river can''t take anyone to
            court, only people who own land beside it can. Critics say that the rights are hard
            to enforce, and that there are hard questions about who speaks for nature and how
            conflicts with human rights are decided.'
consider:
    - Who should be the guardian of a river, and what should they do if the river's needs conflict
        with a town's?
    - 'What other parts of nature could have rights: a glacier, a species, the atmosphere?'
    - Does this change how you think about ownership? What would you do differently with land
        that had rights?
    - Could a company be sued for ecocide, and should it be treated like a war crime?
footnotes:
    ron: '[World Economic Forum: Legal rights for nature](https://www.weforum.org/stories/2023/08/legal-rights-nature-environmental-protection/)'
