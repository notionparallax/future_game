title: Universal work from home policies
live: true
card_type: social
body:
    paragraphs:
        - Remote work due to Covid-19 has exposed the inadequacies of compulsory office attendance;
            now that people are working from home, it will never go back to the way it used
            to be[^wfh]; geographical requirements around talent acquisitions will loosen or
            expand beyond urban centers. Several large employers have since ordered staff back
            to the office, so the balance is still being negotiated.
consider:
    - If you can work from anywhere, why live where you do?
    - 'Who does remote work leave behind: junior staff, people without space at home, the businesses
        that fed the office district?'
    - Is working from home a right, a perk or a trap (always on)?
footnotes:
    wfh: https://www.mintel.com/global-consumer-trends
meta:
    sources:
        -   source_comment: This article has a list of trends, and the first pass is to just
                import them without modification
            source_link: https://www.theguardian.com/commentisfree/2021/feb/15/2020s-trend-predictions-forecasters-working-from-home-ai-climate
