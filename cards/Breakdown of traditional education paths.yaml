title: Breakdown of traditional education paths
live: true
card_type: social
image:
    source: commons-belajar-online-saat-pandemi.jpg
    caption: Children learning online at a solar-powered outdoor shelter in Indonesia
    citation: M Joko Apriyo Putro, CC BY-SA 4.0, via Wikimedia Commons
    link: https://commons.wikimedia.org/wiki/File:Belajar_Online_Saat_Pandemi.jpg
body:
    paragraphs:
        - As the pandemic has interrupted schooling[^schooling] for millions, new relationships
            to online learning will continue to flourish, in addition to trends like unschooling,
            which will penetrate new demographics (beyond the fringe). The weight of student
            debt and continued class conflict will also draw people away from the traditional
            path of college education.
consider:
    - What is the value proposition of universities? Why not just move somewhere extremely cheap
        and do MOOCs for 3 years?
    - Is education about getting smarter, or about conforming, and signalling that conformance?
    - As we live longer what is happening to the proportion of our lives we spend in education?
    - Why do we generally educate in one block? Is that better than, for example, 2 years a
        decade?
footnotes:
    schooling: https://www.mintel.com/global-consumer-trends
