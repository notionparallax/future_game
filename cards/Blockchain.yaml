title: Blockchain
live: true
card_type: technology
image:
    source: commons-cryptocurrency-mining-farm.jpg
    caption: Cryptocurrency mining machines in a data hall in Iceland
    citation: Marco Krohn, CC BY-SA 4.0, via Wikimedia Commons
    link: https://commons.wikimedia.org/wiki/File:Cryptocurrency_Mining_Farm.jpg
body:
    paragraphs:
        - A blockchain is a shared ledger that many computers keep copies of. New entries are
            chained to old ones, so history is very hard to change. It means that strangers
            can agree on who owns what without a bank or a registry in the middle.
        - Cryptocurrencies were the first use, and the one that took off (see Non-sovereign
            currencies). Others have been tried for land titles, supply-chain tracking, voting
            and digital artworks (NFTs). The NFT boom of 2021 collapsed, and most of the other
            uses remain small and technical.
        - The open question is whether trust that is built into software is better than trust
            that is built into institutions, especially when a mistake can't be undone.
consider:
    - What would you want to be impossible to change once it's written down? What would you
        want to be able to fix?
    - 'Who do you trust more to keep the record of who owns land: a government, or a network
        of strangers'' computers?'
    - A ledger that is public and permanent protects against corruption, but is it also a surveillance
        risk?
    - Some blockchains use a lot of electricity. When, if ever, is that worth it?
