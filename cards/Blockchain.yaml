title: Blockchain
live: false
card_type: technology
body:
    paragraphs:
        - More widespread adoption of blockchain technologies will affect the way people portray
            identities online. Protest movements will demand transparency[^blockchainTransparency]
            from power, which will drive adoption of blockchain technologies with their public
            accounting systems. Historically speculative products like NFTs[^NFTs] (non-fungible
            tokens) which create unique digital identities for items like digital artworks or
            gaming items, will go mainstream.
