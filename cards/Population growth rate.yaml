title: Population growth rate
live: true
card_type: trend
image:
    caption: '[^1]'
    source: image35.png
body:
    paragraphs:
        - The world population is growing by ≈200,000 people every day, and passed 8 billion
            in November 2022. The UN expects growth to level out and peak at around 10.3 billion
            in the mid-2080s[^2], but that's an aggregate value. Some countries will still be
            growing fast whilst others, including Japan, China, Russia and Germany, have already
            peaked and are shrinking.
        - There are a lot of factors to population growth. Better sanitation means fewer children
            die. Better access to education for women means that fewer children are born. People
            living longer means that people hang about for longer. Wars push people out of countries,
            prosperity pulls them in.
consider:
    - What job will all these new people do?
    - What will they eat?
    - Where will they live?
    - What factors will drive migration?
    - What limiting factors are there on Australian population growth? What could we do to remove
        those limitations?
footnotes:
    '1': ABS data, high scenario.
    '2': '[UN World Population Prospects 2024](https://population.un.org/wpp/) and Wikipedia:
        [World population](https://en.wikipedia.org/wiki/World_population)'
